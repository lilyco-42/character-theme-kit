<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>惠惠 主题预览</title>
<link rel="stylesheet" href="theme.css">
<style>body{background:#06020F;color:#F1F0FF;font-family:sans-serif;margin:0;padding:40px;}.demo{max-width:900px;margin:0 auto}section{margin:24px 0;padding:24px;background:#100523;border:1px solid #1B093C;border-radius:6px}h2{font-size:16px;color:#7C3AED}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}</style>
</head><body><div class="demo">
<h1>惠惠 · 爆裂·红魔族</h1><p style="color:#909099">为美好的世界献上爆炎 | Character Theme Kit</p>
<section><h2>配色</h2><div class="row">
<div style="text-align:center"><div style="width:60px;height:60px;background:#7C3AED;border-radius:6px"></div><small style="color:#909099">Primary</small></div>
<div style="text-align:center"><div style="width:60px;height:60px;background:#2E1065;border-radius:6px"></div><small style="color:#909099">Deep</small></div>
<div style="text-align:center"><div style="width:60px;height:60px;background:#FACC15;border-radius:6px"></div><small style="color:#909099">Accent</small></div>
<div style="text-align:center"><div style="width:60px;height:60px;background:#C4B5FD;border-radius:6px"></div><small style="color:#909099">Electric</small></div>
</div></section>
<section><h2>按钮</h2><div class="row">
<button class="ctk-btn ctk-btn-primary">Primary</button>
<button class="ctk-btn ctk-btn-secondary">Secondary</button>
<button class="ctk-btn ctk-btn-danger">Danger</button>
</div></section>
<section><h2>卡片</h2><div class="ctk-card"><div class="ctk-card-title">惠惠</div><div class="ctk-card-text">爆裂·红魔族，为美好的世界献上爆炎。</div>
<div style="margin-top:8px"><span class="ctk-badge">RANK S</span><span class="ctk-badge">Fan Theme</span></div></div></section>
<section><h2>输入 & 进度</h2><input class="ctk-input" placeholder="输入..."><div style="margin-top:12px"><div class="ctk-progress"><div class="ctk-progress-bar" style="width:70%"></div></div></div></section>
</div></body></html>
