<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live2D Test</title>
<style>body{margin:0;background:#222} canvas{display:block}</style>
</head>
<body>
<canvas id="view"></canvas>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
window.PIXI = PIXI;
const app = new PIXI.Application({
  view: document.getElementById('view'),
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundAlpha: 0,
  antialias: true
});

// Test with official Haru sample first
PIXI.live2d.Live2DModel.from('https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json').then(model => {
  model.anchor.set(0.5);
  model.position.set(window.innerWidth/2, window.innerHeight/2);
  model.scale.set(0.3);
  app.stage.addChild(model);
  console.log('Haru loaded! children:', model.children.length, 'textures:', model.internalModel.textures?.length);
}).catch(e => console.error('Haru failed:', e));
</script>
</body>
</html>
